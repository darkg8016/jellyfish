<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JELLYFISH CORPORATION · Premium Auth</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪼</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    /* ============ PREMIUM BLACK & WHITE THEME ============ */
    :root{
      --bg-void:#000000;
      --bg-primary:#040406;
      --bg-secondary:#0c0c0f;
      --bg-card:rgba(16,16,20,0.62);
      --bg-card-solid:rgba(13,13,16,0.95);
      --hairline:rgba(255,255,255,0.07);
      --hairline-strong:rgba(255,255,255,0.14);
      --text-primary:#f5f5f7;
      --text-secondary:#a3a3ab;
      --text-muted:#5c5c66;
      --accent:#ffffff;
      --accent-dim:#bdbdbd;
      --accent-deep:#2a2a2a;
      --accent-glow:rgba(255,255,255,0.45);
      --silver:#c9c9c9;
      /* Bioluminescent jellyfish accents — used sparingly over the mono base */
      --bio-cyan:#7ee8f0;
      --bio-violet:#b9a3f5;
      --bio-cyan-dim:rgba(126,232,240,0.5);
      --bio-violet-dim:rgba(185,163,245,0.5);
      --radius-lg:20px;
      --radius:14px;
      --radius-sm:10px;
      --ease:cubic-bezier(0.16,1,0.3,1);
      --ease-soft:cubic-bezier(0.4,0,0.2,1);
      --ease-spring:cubic-bezier(0.34,1.56,0.64,1);
      --mono:'JetBrains Mono',monospace;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{background:var(--bg-primary);}
    body{
      font-family:'Space Grotesk',sans-serif;
      color:var(--text-primary);
      min-height:100vh;
      overflow-x:hidden;
      position:relative;
    }
    body::before{
      content:'';position:fixed;inset:-10%;z-index:0;pointer-events:none;
      background-image:
        radial-gradient(ellipse 900px 600px at 15% 8%, rgba(126,232,240,0.075) 0%, transparent 60%),
        radial-gradient(ellipse 800px 700px at 90% 18%, rgba(185,163,245,0.06) 0%, transparent 55%),
        radial-gradient(ellipse 1000px 800px at 50% 112%, rgba(255,255,255,0.045) 0%, transparent 62%),
        radial-gradient(ellipse 700px 500px at 8% 95%, rgba(126,232,240,0.05) 0%, transparent 58%);
      background-repeat:no-repeat;
      will-change:transform,opacity;
      animation:cloudDrift 26s ease-in-out infinite alternate;
    }
    @keyframes cloudDrift{
      0%{transform:translate3d(0,0,0) scale(1);opacity:0.85;}
      50%{transform:translate3d(1.5%,-1.5%,0) scale(1.04);opacity:1;}
      100%{transform:translate3d(-1.5%,1%,0) scale(1.02);opacity:0.92;}
    }
    @keyframes bgDrift{0%{opacity:0.8;}100%{opacity:1;}}
    body::after{
      content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.28;
      background-image:linear-gradient(rgba(255,255,255,0.014) 1px, transparent 1px),
                       linear-gradient(90deg, rgba(255,255,255,0.014) 1px, transparent 1px);
      background-size:44px 44px;
      mask-image:radial-gradient(ellipse 70% 60% at 50% 20%, black 20%, transparent 78%);
    }
    #particleCanvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.75;}
    @media (prefers-reduced-motion: reduce){ body::before{animation:none;} }
    #scanlineLayer{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:0.4;}
    #scanlineLayer::before{content:'';position:absolute;left:0;right:0;height:120px;top:-120px;
      background:linear-gradient(180deg,transparent,rgba(255,255,255,0.05),transparent);
      animation:scanMove 8s linear infinite;}
    ::-webkit-scrollbar{width:8px;}
    ::-webkit-scrollbar-track{background:var(--bg-primary);}
    ::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--bio-cyan),#666,#222);border-radius:10px;}

    @keyframes fadeUp{from{opacity:0;transform:translateY(22px);}to{opacity:1;transform:translateY(0);}}
    @keyframes floatSlow{0%,100%{transform:translateY(0) rotate(0);}50%{transform:translateY(-10px) rotate(1.2deg);}}
    @keyframes pulseGlowW{0%,100%{box-shadow:0 0 22px rgba(255,255,255,0.18),0 0 0 0 rgba(255,255,255,0);}50%{box-shadow:0 0 48px rgba(255,255,255,0.42),0 0 0 8px rgba(255,255,255,0.03);}}
    @keyframes ringSpin{to{transform:rotate(360deg);}}
    @keyframes drawBar{from{width:100%;}to{width:0%;}}
    @keyframes spin{to{transform:rotate(360deg);}}
    @keyframes toastIn{from{opacity:0;transform:translateX(60px) scale(0.95);}to{opacity:1;transform:translateX(0) scale(1);}}
    @keyframes gradientShine{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
    @keyframes borderTravel{0%{background-position:220% 0;}100%{background-position:-220% 0;}}
    @keyframes ringPulse{0%{transform:scale(0.8);opacity:0.9;}100%{transform:scale(1.7);opacity:0;}}
    @keyframes scanMove{0%{transform:translateY(-120px);}100%{transform:translateY(100vh);}}
    @keyframes rippleAnim{to{transform:scale(3.2);opacity:0;}}
    @keyframes blinkCursor{0%,100%{opacity:1;}50%{opacity:0;}}
    @keyframes badgePulse{
      0%{box-shadow:0 0 12px rgba(var(--pulse-rgb,255,255,255),0.7),0 0 0 0 rgba(var(--pulse-rgb,255,255,255),0.45);}
      70%{box-shadow:0 0 12px rgba(var(--pulse-rgb,255,255,255),0.7),0 0 0 8px rgba(var(--pulse-rgb,255,255,255),0);}
      100%{box-shadow:0 0 12px rgba(var(--pulse-rgb,255,255,255),0.7),0 0 0 0 rgba(var(--pulse-rgb,255,255,255),0);}
    }
    @keyframes jellyBob{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-6px) scale(1.03);}}
    @keyframes tentacleWave{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(3px) rotate(2deg);}}

    .app-wrapper{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:22px 24px 48px;min-height:100vh;display:flex;flex-direction:column;}

    /* ============ Header ============ */
    .brand-header{display:flex;align-items:center;justify-content:space-between;padding:14px 4px 26px;border-bottom:1px solid var(--hairline);flex-wrap:wrap;gap:16px;position:relative;}
    .brand-header::after{content:'';position:absolute;bottom:-1px;left:0;width:140px;height:1px;
      background:linear-gradient(90deg,#fff,transparent);}
    .brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;}
    .brand-icon{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #2a2a2a 0%, #0a0a0a 70%, #000 100%);
      display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;
      border:1px solid rgba(255,255,255,0.12);animation:pulseGlowW 3.4s infinite;}
    .brand-icon::before{content:'';position:absolute;inset:-3px;border-radius:50%;
      background:conic-gradient(from 0deg,var(--bio-cyan),transparent 30%,transparent 70%,var(--bio-violet),var(--bio-cyan));
      -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1px));
      mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1px));
      opacity:0.65;animation:ringSpin 12s linear infinite;}
    .brand-icon .badge{position:absolute;top:-3px;right:-3px;width:14px;height:14px;background:var(--bio-cyan);
      border-radius:50%;border:2px solid var(--bg-primary);--pulse-rgb:126,232,240;animation:badgePulse 2.6s infinite;}
    .jelly-logo-svg{width:100%;height:100%;overflow:visible;display:block;padding:8px;}
    .jelly-bell{animation:jellyBob 4.5s ease-in-out infinite;transform-origin:50px 40px;}
    .jelly-tent{animation:tentacleWave 3.6s ease-in-out infinite;transform-origin:top center;}
    .jelly-tent:nth-child(2){animation-delay:0.3s;}
    .jelly-tent:nth-child(3){animation-delay:0.6s;}
    .jelly-tent:nth-child(4){animation-delay:0.9s;}
    .jelly-tent:nth-child(5){animation-delay:1.2s;}
    .brand-text .main{font-family:'Orbitron',sans-serif;font-weight:900;font-size:20px;letter-spacing:2.5px;
      background:linear-gradient(120deg,#fff 25%,#777 55%,#fff 85%);
      background-size:220% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
      animation:gradientShine 6s ease infinite;display:block;}
    .brand-text .sub{font-family:'Orbitron',sans-serif;font-weight:500;font-size:9px;letter-spacing:4px;
      color:var(--text-muted);text-transform:uppercase;display:block;margin-top:2px;}
    .brand-text .sub span{color:#fff;}
    .header-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}

    /* ============ Buttons ============ */
    .btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;
      padding:11px 24px;border:none;border-radius:var(--radius-sm);
      font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;cursor:pointer;
      transition:transform .25s var(--ease),box-shadow .25s var(--ease),background .25s var(--ease);
      text-decoration:none;background:transparent;color:var(--text-primary);
      border:1px solid var(--hairline-strong);isolation:isolate;}
    .btn:active{transform:scale(0.97);}
    .btn .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,0.35);
      transform:scale(0);animation:rippleAnim .6s ease-out forwards;pointer-events:none;z-index:0;}
    .btn-primary{background:linear-gradient(135deg,#fff,#e2e2e2 45%,#bdbdbd);background-size:180% 180%;color:#000;border-color:transparent;
      box-shadow:0 4px 24px rgba(255,255,255,0.15);font-weight:700;transition:transform .25s var(--ease-spring),box-shadow .25s var(--ease-soft),background-position .5s var(--ease-soft);}
    .btn-primary:hover{box-shadow:0 10px 38px rgba(255,255,255,0.32),0 0 24px -6px rgba(126,232,240,0.25);transform:translateY(-2px);background-position:100% 100%;}
    .btn-primary::before{content:'';position:absolute;inset:0;border-radius:inherit;opacity:0;
      background:linear-gradient(120deg,transparent 30%,rgba(126,232,240,0.35),rgba(185,163,245,0.35),transparent 70%);
      transition:opacity .3s;pointer-events:none;}
    .btn-primary:hover::before{opacity:1;}
    .btn-silver{background:linear-gradient(135deg,#3a3a3a,#1a1a1a);color:#fff;border-color:rgba(255,255,255,0.14);font-weight:700;}
    .btn-silver:hover{background:linear-gradient(135deg,#4a4a4a,#252525);box-shadow:0 8px 30px rgba(255,255,255,0.14);transform:translateY(-1px);}
    .btn-outline{background:rgba(255,255,255,0.02);}
    .btn-outline:hover{background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.22);}
    .btn-sm{padding:7px 16px;font-size:12.5px;}
    .btn-xs{padding:5px 12px;font-size:11px;border-radius:7px;}
    .btn-icon{padding:7px 10px;}
    .btn-danger{background:rgba(255,110,90,0.1);color:#ffb3a3;border-color:rgba(255,110,90,0.28);}
    .btn-danger:hover{background:rgba(255,110,90,0.18);box-shadow:0 8px 26px -10px rgba(255,110,90,0.35);transform:translateY(-1px);}
    .btn-success{background:rgba(126,232,240,0.1);color:#a8ecf2;border-color:rgba(126,232,240,0.28);}
    .btn-success:hover{background:rgba(126,232,240,0.18);box-shadow:0 8px 26px -10px rgba(126,232,240,0.35);transform:translateY(-1px);}
    .btn-block{width:100%;justify-content:center;}
    .btn[disabled]{opacity:0.5;cursor:not-allowed;transform:none !important;}

    /* ============ Cards ============ */
    .card{position:relative;background:var(--bg-card);border:1px solid var(--hairline);
      border-radius:var(--radius-lg);padding:30px 32px;
      backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);
      box-shadow:0 20px 60px -20px rgba(0,0,0,0.8);
      transition:border-color .35s var(--ease-soft),box-shadow .35s var(--ease-soft),transform .35s var(--ease-soft);
      overflow:hidden;}
    .card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
      background:linear-gradient(90deg,transparent,rgba(126,232,240,0.7),rgba(255,255,255,0.95),rgba(185,163,245,0.7),transparent 80%);
      background-size:260% 100%;opacity:0.55;animation:borderTravel 6s linear infinite;will-change:background-position;}
    .card::after{content:'';position:absolute;top:-50%;left:-60%;width:40%;height:200%;
      background:linear-gradient(120deg,transparent,rgba(255,255,255,0.06),transparent);
      transform:rotate(20deg);transition:left .9s var(--ease);pointer-events:none;}
    .card:hover::after{left:130%;}
    .card:hover{border-color:rgba(255,255,255,0.2);transform:translateY(-4px);
      box-shadow:0 28px 76px -18px rgba(0,0,0,0.88),0 0 46px -12px rgba(126,232,240,0.1),0 0 30px -14px rgba(185,163,245,0.1);}
    .card-glow{border-color:rgba(255,255,255,0.12);box-shadow:0 0 50px -10px rgba(255,255,255,0.06),0 20px 60px -20px rgba(0,0,0,0.8);}
    .card-title{font-family:'Orbitron',sans-serif;font-weight:700;font-size:16px;letter-spacing:0.4px;
      margin-bottom:6px;display:flex;align-items:center;gap:10px;color:#fff;}
    .card-title .icon{color:#fff;font-size:18px;filter:drop-shadow(0 0 8px rgba(255,255,255,0.5));}
    .card-sub{font-size:13px;color:var(--text-muted);margin-bottom:22px;line-height:1.5;}

    .hud-corner{position:absolute;width:16px;height:16px;border-color:rgba(255,255,255,0.55);
      pointer-events:none;filter:drop-shadow(0 0 5px rgba(255,255,255,0.4));z-index:2;}
    .hud-corner.tl{top:10px;left:10px;border-top:2px solid;border-left:2px solid;}
    .hud-corner.tr{top:10px;right:10px;border-top:2px solid;border-right:2px solid;}
    .hud-corner.bl{bottom:10px;left:10px;border-bottom:2px solid;border-left:2px solid;}
    .hud-corner.br{bottom:10px;right:10px;border-bottom:2px solid;border-right:2px solid;}

    /* ============ Form ============ */
    .form-group{margin-bottom:18px;}
    .form-group label{display:block;font-size:12px;font-weight:600;color:var(--text-secondary);
      margin-bottom:6px;letter-spacing:0.5px;text-transform:uppercase;}
    .form-control{width:100%;padding:13px 16px;background:rgba(255,255,255,0.035);
      border:1px solid var(--hairline-strong);border-radius:var(--radius-sm);color:var(--text-primary);
      font-family:'Space Grotesk',sans-serif;font-size:14px;
      transition:border-color .25s var(--ease-soft),box-shadow .25s var(--ease-soft),background .25s var(--ease-soft);
      outline:none;}
    .form-control:focus{border-color:var(--bio-cyan);box-shadow:0 0 0 4px rgba(126,232,240,0.12);background:rgba(255,255,255,0.055);}
    .form-control::placeholder{color:var(--text-muted);font-size:13px;}
    .input-icon-group{position:relative;}
    .input-icon-group i{position:absolute;left:14px;top:50%;transform:translateY(-50%);
      color:var(--text-muted);font-size:13px;pointer-events:none;transition:color .25s;}
    .input-icon-group .form-control{padding-left:38px;}
    .input-icon-group .form-control:focus ~ i{color:var(--bio-cyan);}

    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
    .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:26px;}
    .stat-item{position:relative;background:rgba(255,255,255,0.025);border:1px solid var(--hairline);
      border-radius:var(--radius-sm);padding:18px 20px;text-align:center;overflow:hidden;
      transition:border-color .3s,transform .3s var(--ease-spring),box-shadow .3s;
      animation:fadeUp .5s var(--ease) both;}
    .stat-item:nth-child(1){animation-delay:.02s;} .stat-item:nth-child(2){animation-delay:.07s;}
    .stat-item:nth-child(3){animation-delay:.12s;} .stat-item:nth-child(4){animation-delay:.17s;}
    .stat-item:nth-child(5){animation-delay:.22s;} .stat-item:nth-child(6){animation-delay:.27s;}
    .stat-item::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;transform:scaleX(0);
      transform-origin:left;transition:transform .4s var(--ease-soft);
      background:linear-gradient(90deg,var(--bio-cyan),var(--bio-violet));}
    .stat-item:hover::before{transform:scaleX(1);}
    .stat-item:hover{border-color:rgba(255,255,255,0.22);transform:translateY(-3px);
      box-shadow:0 12px 32px -12px rgba(126,232,240,0.16),0 12px 32px -12px rgba(185,163,245,0.1);}
    .stat-item .label{font-size:10.5px;text-transform:uppercase;letter-spacing:1.3px;color:var(--text-muted);font-weight:600;}
    .stat-item .value{font-family:'Orbitron',sans-serif;font-size:18px;font-weight:700;
      margin-top:6px;color:#fff;word-break:break-all;}
    .stat-item .copy-mini{position:absolute;top:8px;right:8px;background:rgba(255,255,255,0.05);
      border:1px solid var(--hairline-strong);color:var(--text-muted);border-radius:6px;
      width:22px;height:22px;font-size:10px;display:flex;align-items:center;justify-content:center;
      cursor:pointer;transition:all .2s;}
    .stat-item .copy-mini:hover{color:#fff;border-color:rgba(255,255,255,0.4);}

    .badge-status{display:inline-flex;align-items:center;gap:7px;padding:5px 16px;border-radius:100px;
      font-size:11.5px;font-weight:700;letter-spacing:0.6px;font-family:'Orbitron',sans-serif;}
    .badge-status.active{background:linear-gradient(135deg,rgba(126,232,240,0.14),rgba(185,163,245,0.14));color:#fff;
      border:1px solid rgba(255,255,255,0.24);--pulse-rgb:126,232,240;animation:badgePulse 2.6s infinite;}
    .badge-status.active .dot{background:var(--bio-cyan);box-shadow:0 0 8px var(--bio-cyan-dim);}
    .badge-status.inactive{background:rgba(255,255,255,0.03);color:var(--text-muted);border:1px solid var(--hairline-strong);}
    .badge-status .dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:currentColor;}

    .table-wrap{overflow-x:auto;margin-top:14px;}
    table{width:100%;border-collapse:collapse;font-size:13px;}
    table th{text-align:left;padding:12px 14px;color:var(--text-muted);font-weight:700;font-size:10.5px;
      text-transform:uppercase;letter-spacing:0.6px;border-bottom:1px solid var(--hairline);}
    table td{padding:13px 14px;border-bottom:1px solid rgba(255,255,255,0.03);color:var(--text-secondary);}
    table tr{transition:background .25s;}
    table tbody tr{position:relative;}
    table tbody tr:hover{background:rgba(126,232,240,0.035);}
    table tbody tr:hover td:first-child{box-shadow:inset 2px 0 0 var(--bio-cyan);}
    table .key-cell{font-family:var(--mono);font-size:11.5px;color:#fff;letter-spacing:0.5px;}

    /* ============ Tabs ============ */
    .tabs{position:relative;display:flex;gap:4px;border-bottom:1px solid var(--hairline);margin-bottom:24px;flex-wrap:wrap;}
    .tab-btn{position:relative;padding:11px 20px;background:transparent;border:none;color:var(--text-muted);
      font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13.5px;cursor:pointer;
      border-bottom:2px solid transparent;transition:color .25s;display:inline-flex;align-items:center;gap:7px;}
    .tab-btn:hover{color:var(--text-primary);}
    .tab-btn.active{color:#fff;text-shadow:0 0 12px rgba(255,255,255,0.4);}
    .tab-indicator{position:absolute;bottom:-1px;height:2px;left:0;width:0;border-radius:2px;
      background:linear-gradient(90deg,var(--bio-cyan),#fff,var(--bio-violet));
      box-shadow:0 0 10px rgba(255,255,255,0.5);
      transition:transform .35s var(--ease),width .35s var(--ease);pointer-events:none;will-change:transform,width;}
    .tab-pane{display:none;}
    .tab-pane.active{display:block;animation:fadeUp .4s var(--ease) both;}

    /* ============ Toast ============ */
    .toast-container{position:fixed;top:22px;right:22px;z-index:9999;display:flex;flex-direction:column;
      gap:10px;max-width:380px;width:calc(100% - 44px);}
    .toast{position:relative;padding:15px 20px 15px 18px;border-radius:var(--radius-sm);background:var(--bg-card-solid);
      border:1px solid var(--hairline-strong);border-left:3px solid var(--hairline-strong);backdrop-filter:blur(24px);
      box-shadow:0 14px 44px rgba(0,0,0,0.7);display:flex;align-items:center;gap:12px;
      animation:toastIn .4s var(--ease-spring) both;font-size:13.5px;color:var(--text-primary);overflow:hidden;}
    .toast.success{border-color:rgba(255,255,255,0.24);border-left-color:var(--bio-cyan);}
    .toast.error{border-color:rgba(255,255,255,0.34);border-left-color:#ff8a80;}
    .toast.info{border-left-color:var(--bio-violet);}
    .toast .toast-bar{position:absolute;bottom:0;left:0;height:2px;background:currentColor;
      opacity:0.5;animation:drawBar 4s linear forwards;}

    /* ============ Auth ============ */
    .auth-container{max-width:460px;margin:50px auto 40px;padding:0 16px;position:relative;z-index:2;}
    .auth-container .card{padding:42px 38px;}
    .brand-center{text-align:center;margin-bottom:30px;}

  </style>
</head>

<script>
(function(){
  'use strict';

  // ============ Particles (White/Silver) ============
  (function initParticles(){
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let w, h, particles = [], orbs = [];
    const mouse = { x: -9999, y: -9999 };
    let t = 0;
    function count(){ return window.innerWidth < 700 ? 40 : 85; }
    function resize(){ w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
    function makeParticles(){
      particles = Array.from({length: count()}, () => ({
        x: Math.random()*w, y: Math.random()*h,
        vx: (Math.random()-0.5)*0.32, vy: (Math.random()-0.5)*0.32,
        r: Math.random()*1.6+0.5, tw: Math.random()*Math.PI*2
      }));
      orbs = Array.from({length: 6}, (_, i) => ({
        x: Math.random()*w, y: Math.random()*h,
        vx: (Math.random()-0.5)*0.1, vy: (Math.random()-0.5)*0.1,
        r: Math.random()*3+2.4,
        hue: i % 3 === 0 ? '126,232,240' : (i % 3 === 1 ? '185,163,245' : '255,255,255')
      }));
    }
    window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });
    window.addEventListener('touchmove', (e) => { if (e.touches[0]) { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; } }, { passive:true });

    function step(){
      t += 0.016;
      ctx.clearRect(0,0,w,h);
      for (const o of orbs){
        o.x += o.vx; o.y += o.vy;
        if (o.x < -50 || o.x > w+50) o.vx *= -1;
        if (o.y < -50 || o.y > h+50) o.vy *= -1;
        const grad = ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r*18);
        grad.addColorStop(0, `rgba(${o.hue},0.1)`);
        grad.addColorStop(1, `rgba(${o.hue},0)`);
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(o.x, o.y, o.r*18, 0, Math.PI*2); ctx.fill();
      }
      for (const p of particles){
        const dx = p.x - mouse.x, dy = p.y - mouse.y;
        const dist = Math.sqrt(dx*dx+dy*dy);
        if (dist < 120 && dist > 0.01){
          const force = (120 - dist) / 120;
          p.x += (dx/dist) * force * 1.6;
          p.y += (dy/dist) * force * 1.6;
        }
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > w) p.vx *= -1;
        if (p.y < 0 || p.y > h) p.vy *= -1;
        const alpha = 0.28 + 0.35 * Math.sin(t*1.4 + p.tw);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
        ctx.shadowBlur = 6;
        ctx.shadowColor = 'rgba(255,255,255,0.85)';
        ctx.fillStyle = 'rgba(255,255,255,' + alpha.toFixed(2) + ')';
        ctx.fill();
        ctx.shadowBlur = 0;
      }
      for (let i=0;i<particles.length;i++){
        for (let j=i+1;j<particles.length;j++){
          const a = particles[i], b = particles[j];
          const dx = a.x-b.x, dy = a.y-b.y;
          const dist = Math.sqrt(dx*dx+dy*dy);
          if (dist < 130){
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
            ctx.strokeStyle = 'rgba(255,255,255,' + (0.1 * (1 - dist/130)).toFixed(2) + ')';
            ctx.lineWidth = 1; ctx.stroke();
          }
        }
      }
      if (!reduceMotion) requestAnimationFrame(step);
    }
    resize(); makeParticles();
    window.addEventListener('resize', () => { resize(); makeParticles(); });
    if (!reduceMotion) requestAnimationFrame(step); else step();
  })();

  // ============ State & Helpers ============
  const STATE = { user: null, token: null, page: 'dashboard' };
  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => document.querySelectorAll(sel);
  const pageContent = $('#pageContent');
  const headerActions = $('#headerActions');
  const toastContainer = $('#toastContainer');

  function showToast(message, type = 'info', duration = 4000) {
    const icons = { error: '❌', success: '✅', info: '⚡' };
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.innerHTML = `<span class="toast-icon">${icons[type] || '⚡'}</span><span>${message}</span><span class="toast-bar" style="animation-duration:${duration}ms;"></span>`;
    toastContainer.appendChild(el);
    setTimeout(() => {
      el.style.opacity = '0';
      el.style.transform = 'translateX(40px)';
      el.style.transition = '0.3s ease';
      setTimeout(() => el.remove(), 400);
    }, duration);
  }

  // Delegated copy-to-clipboard (safer than embedding raw values in inline onclick strings)
  document.addEventListener('click', (e) => {
    const copyBtn = e.target.closest('[data-copy]');
    if (copyBtn) window._copyText(copyBtn.getAttribute('data-copy'), copyBtn);
  });

  // Ripple + click sound
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('.btn');
    if (!btn || btn.disabled) return;
    const rect = btn.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    const span = document.createElement('span');
    span.className = 'ripple';
    span.style.width = span.style.height = size + 'px';
    span.style.left = (e.clientX - rect.left - size/2) + 'px';
    span.style.top = (e.clientY - rect.top - size/2) + 'px';
    btn.appendChild(span);
    setTimeout(() => span.remove(), 650);
    playClickSound();
  });

  let _audioCtx = null;
  function getAudioCtx() {
    if (!_audioCtx) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) _audioCtx = new Ctx();
    }
    return _audioCtx;
  }
  function playClickSound() {
    try {
      const ctx = getAudioCtx();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(820, now);
      osc.frequency.exponentialRampToValueAtTime(220, now + 0.09);
      gain.gain.setValueAtTime(0.06, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.11);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now); osc.stop(now + 0.12);
    } catch (e) {}
  }
  ['click','keydown','touchstart'].forEach(evt => document.addEventListener(evt, () => getAudioCtx(), { once: true }));

  // Cursor glow + tilt
  (function initMouseFX() {
    const glow = document.getElementById('cursorGlow');
    let targetX = window.innerWidth / 2, targetY = window.innerHeight / 2;
    let currentX = targetX, currentY = targetY;
    function loop() {
      currentX += (targetX - currentX) * 0.15;
      currentY += (targetY - currentY) * 0.15;
      if (glow) glow.style.transform = `translate(${currentX}px, ${currentY}px) translate(-50%,-50%)`;
      requestAnimationFrame(loop);
    }
    window.addEventListener('mousemove', (e) => {
      targetX = e.clientX; targetY = e.clientY;
      if (glow) glow.classList.add('on');
      const tiltEl = e.target.closest('.tilt-3d');
      document.querySelectorAll('.tilt-3d').forEach(el => {
        if (el !== tiltEl) return;
        const rect = el.getBoundingClientRect();
        const px = (e.clientX - rect.left) / rect.width;
        const py = (e.clientY - rect.top) / rect.height;
        const rx = (0.5 - py) * 14;
        const ry = (px - 0.5) * 14;
        el.style.transform = `perspective(700px) rotateX(${rx}deg) rotateY(${ry}deg) scale3d(1.02,1.02,1.02)`;
      });
    });
    document.addEventListener('mouseleave', () => { if (glow) glow.classList.remove('on'); }, true);
    document.addEventListener('mouseout', (e) => {
      const el = e.target.closest && e.target.closest('.tilt-3d');
      if (el && !el.contains(e.relatedTarget)) {
        el.style.transform = 'perspective(700px) rotateX(0deg) rotateY(0deg) scale3d(1,1,1)';
      }
    });
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) loop();
  })();

  // API
  async function apiCall(endpoint, method = 'GET', body = null, token = null) {
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = `Bearer ${token}`;
    const opts = { method, headers };
    if (body) opts.body = JSON.stringify(body);
    try {
      const res = await fetch(endpoint, opts);
      let data;
      try { data = await res.json(); } catch { data = { success:false, message:'Invalid server response.' }; }
      if (res.status === 401 && STATE.token) {
        setToken(null); setUser(null); STATE.user = null;
        showToast(data.message || 'Session expired. Please login again.', 'error');
        navigate('login');
      }
      if (!res.ok && data.success === undefined) data.success = false;
      return data;
    } catch (e) {
      console.error('API Error:', e);
      return { success: false, message: 'Network error.' };
    }
  }

  function getToken() { return localStorage.getItem('jelly_token'); }
  function setToken(token) {
    if (token) { localStorage.setItem('jelly_token', token); STATE.token = token; }
    else { localStorage.removeItem('jelly_token'); STATE.token = null; }
  }
  function getUser() {
    try { const d = localStorage.getItem('jelly_user'); return d ? JSON.parse(d) : null; } catch { return null; }
  }
  function setUser(user) {
    if (user) { localStorage.setItem('jelly_user', JSON.stringify(user)); STATE.user = user; }
    else { localStorage.removeItem('jelly_user'); STATE.user = null; }
  }
  function isLoggedIn() { return !!getToken() && !!getUser(); }
  function getRole() { return (STATE.user && STATE.user.role) || 'guest'; }
  function isActive(user) { return !!user && user.premiumStatus === 'active'; }

  function formatTimeLeft(expiresAt) {
    if (expiresAt === null || expiresAt === undefined) return { percent: 100, big: '∞', small: 'LIFETIME', expired: false };
    const diff = expiresAt - Date.now();
    if (diff <= 0) return { percent: 0, big: '0', small: 'EXPIRED', expired: true };
    const days = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const percent = Math.max(4, Math.min(100, (diff / (30*86400000)) * 100));
    return { percent, big: days > 0 ? String(days) : String(hours), small: days > 0 ? 'DAYS LEFT' : 'HOURS LEFT', expired: false };
  }

  function licenseRingSVG(info) {
    const r = 54, c = 2 * Math.PI * r;
    const offset = c - (info.percent / 100) * c;
    return `
      <svg width="130" height="130" viewBox="0 0 130 130">
        <circle cx="65" cy="65" r="${r}" class="ring-bg"/>
        <circle cx="65" cy="65" r="${r}" class="ring-fg" style="stroke-dasharray:${c.toFixed(1)};stroke-dashoffset:${offset.toFixed(1)};"/>
      </svg>
      <div class="ring-center"><div class="big">${info.big}</div><div class="small">${info.small}</div></div>
    `;
  }

    const container = document.getElementById(containerId);

    if (!indicator) {
      indicator = document.createElement('span');
      indicator.className = 'tab-indicator';
      container.appendChild(indicator);
    }
    function move(btn) {
      if (!btn) return;
      indicator.style.width = btn.offsetWidth + 'px';
      indicator.style.transform = `translateX(${btn.offsetLeft}px)`;
    }
    const sync = () => move(container.querySelector('.tab-btn.active'));

    window.addEventListener('resize', sync);

    function fmtCountdown(ms) {
      const totalSec = Math.max(0, Math.ceil(ms / 1000));
      const h = String(Math.floor(totalSec / 3600)).padStart(2, '0');
      const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
      const s = String(totalSec % 60).padStart(2, '0');
      return `${h}:${m}:${s}`;
    }
    function refreshSidCooldownUI() {
      const chip = document.getElementById('sidCooldownChip');
      const sidBtn = document.getElementById('updateSidBtn');

  // ============ Utility ============
  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m]));
  }
  function escapeAttr(str) { return escapeHtml(str).replace(/"/g, '&quot;'); }
  function formatBytes(bytes) {
    if (!bytes || bytes < 1024) return (bytes || 0) + ' B';
    if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
    return (bytes/(1024*1024)).toFixed(2) + ' MB';
  }

  };

  window._deleteKey = async function(key) {
    if (!confirm(`Delete key "${key}"?\n\n⚠️ Any client bound to this key will lose access immediately.`)) return;
    try {
      const res = await apiCall('/api/admin/delete-key', 'DELETE', { key }, getToken());
      if (res.success) { showToast(res.message, 'success', 5000); loadAdminKeys(); }
      else showToast(res.message || 'Failed.', 'error');
    } catch (err) { showToast('Error: ' + err.message, 'error'); }
  };

  async function loadAdminResources() {
    const list = document.getElementById('adminResourcesList');
    if (!list) return;
    list.innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i></div>';
    try {
      const res = await apiCall('/api/admin/resources', 'GET', null, getToken());
      if (res.success && res.resources) {
        if (res.resources.length === 0) {
          list.innerHTML = `<div class="empty-state"><i class="fas fa-folder-open"></i><div class="title">No resources yet</div></div>`;
          return;
        }
        list.innerHTML = res.resources.map(r => `
          <div style="padding:12px 0;border-bottom:1px solid var(--hairline);display:flex;align-items:center;gap:12px;">
            <div class="res-icon" style="width:34px;height:34px;font-size:14px;flex-shrink:0;">
              <i class="fas ${r.type === 'file' ? 'fa-file' : 'fa-link'}"></i>
            </div>
            <div style="flex:1;min-width:0;">
              <div style="font-size:13px;font-weight:600;color:#fff;word-break:break-word;">${escapeHtml(r.title)}</div>
              <div style="font-size:11px;color:var(--text-muted);margin-top:2px;">
                ${r.type === 'file' ? '📎 ' + escapeHtml(r.fileName || 'file') + ' · ' + formatBytes(r.fileSize) : '🔗 Link'} · ${new Date(r.createdAt).toLocaleDateString()}
              </div>
            </div>
            <button class="btn btn-sm btn-danger" onclick="window._deleteResource('${r.id}')"><i class="fas fa-trash"></i></button>
          </div>
        `).join('');
      } else list.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><div class="title">Failed to load</div></div>`;
    } catch { list.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><div class="title">Error</div></div>`; }
  }

  window._deleteResource = async function(id) {
    if (!confirm('Delete this resource? This cannot be undone.')) return;
    try {
      const res = await apiCall('/api/admin/delete-resource', 'DELETE', { id }, getToken());
      if (res.success) { showToast('Resource deleted.', 'success'); loadAdminResources(); }
      else showToast(res.message || 'Failed.', 'error');
    } catch (err) { showToast('Error: ' + err.message, 'error'); }
  };

  async function loadAdminResellers() {
    const tbody = document.getElementById('adminResellersBody');
    if (!tbody) return;
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);">Loading...</td></tr>';
    try {
      const res = await apiCall('/api/admin/resellers', 'GET', null, getToken());
      if (res.success && res.resellers) {
        if (res.resellers.length === 0) { tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);">No resellers.</td></tr>'; return; }
        tbody.innerHTML = res.resellers.map(r => `
          <tr>
            <td>${escapeHtml(r.username)}</td>
            <td>${escapeHtml(r.provider || '—')}</td>
            <td style="font-size:11px;color:var(--text-muted);">${new Date(r.createdAt).toLocaleDateString()}</td>
            <td>${r.active !== undefined ? (r.active ? '🟢 Active' : '🔴 Banned') : '🟢 Active'}</td>
            <td>
              <button class="btn btn-sm ${r.active ? 'btn-danger' : 'btn-success'}" onclick="window._toggleResellerActive('${escapeAttr(r.username)}')">${r.active ? 'Ban' : 'Unban'}</button>
              <button class="btn btn-sm btn-danger" onclick="window._deleteReseller('${escapeAttr(r.username)}')">Delete</button>
            </td>
          </tr>
        `).join('');
      } else tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);">Failed.</td></tr>';
    } catch { tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);">Error.</td></tr>'; }
  }

  window._toggleResellerActive = async function(username) {
    try {
      const res = await apiCall('/api/admin/toggle-reseller-active', 'POST', { username }, getToken());
      if (res.success) { showToast(res.message, 'success'); loadAdminResellers(); }
      else showToast(res.message || 'Failed.', 'error');
    } catch (err) { showToast('Error: ' + err.message, 'error'); }
  };

  window._deleteReseller = async function(username) {
    if (!confirm(`Delete reseller "${username}"?`)) return;
    try {
      const res = await apiCall('/api/admin/delete-reseller', 'DELETE', { username }, getToken());
      if (res.success) { showToast('Reseller deleted.', 'success'); loadAdminResellers(); }
      else showToast(res.message || 'Failed.', 'error');
    } catch (err) { showToast('Error: ' + err.message, 'error'); }
  };

  async function loadAdminUsers() {
    const tbody = document.getElementById('adminUsersBody');
    if (!tbody) return;
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-muted);">Loading...</td></tr>';
    try {
      const res = await apiCall('/api/admin/users', 'GET', null, getToken());
      if (res.success && res.users) {
        if (res.users.length === 0) { tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-muted);">No users.</td></tr>'; return; }
        tbody.innerHTML = res.users.map(u => `
          <tr>
            <td>${escapeHtml(u.username)}</td>
            <td>${escapeHtml(u.email || '—')}</td>
            <td>${escapeHtml(u.provider || '—')}</td>
            <td>${u.premiumStatus === 'active' ? '🟢 Active' : (u.premiumStatus === 'expired' ? '🟠 Expired' : '🔴 Inactive')}</td>
            <td style="font-size:11px;font-family:var(--mono);">${escapeHtml(u.premiumKey || '—')}</td>
            <td>${u.active !== undefined ? (u.active ? '🟢 Active' : '🔴 Banned') : '🟢 Active'}</td>
            <td>
              ${u.role === 'admin' ? '—' : `<button class="btn btn-sm ${u.active ? 'btn-danger' : 'btn-success'}" onclick="window._toggleUserActive('${escapeAttr(u.username)}')">${u.active ? 'Ban' : 'Unban'}</button>`}
            </td>
          </tr>
        `).join('');
      } else tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-muted);">Failed.</td></tr>';
    } catch { tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-muted);">Error.</td></tr>'; }
  }

  window._toggleUserActive = async function(username) {
    try {
      const res = await apiCall('/api/admin/toggle-user-active', 'POST', { username }, getToken());
      if (res.success) { showToast(res.message, 'success'); loadAdminUsers(); }
      else showToast(res.message || 'Failed.', 'error');
    } catch (err) { showToast('Error: ' + err.message, 'error'); }
  };

  window._adminRefreshKeys = loadAdminKeys;

  // ============ Reseller ============
  function renderReseller() {
    const user = STATE.user;
    if (!user || user.role !== 'reseller') { navigate('dashboard'); return; }
    pageContent.innerHTML = `
      <div class="page-enter">
        <div class="section-title reveal">
          <h2>🔄 Reseller Panel · <span class="highlight">${user.username}</span></h2>
          <span style="font-size:13px;color:var(--text-muted);">Provider: ${user.provider || '—'}</span>
        </div>
        <div class="tabs reveal" id="resellerTabs">
          <button class="tab-btn active" data-tab="reseller-keys"><i class="fas fa-key"></i> My Keys</button>
          <button class="tab-btn" data-tab="reseller-clients"><i class="fas fa-user"></i> My Clients</button>
          <button class="tab-btn" data-tab="reseller-create"><i class="fas fa-plus"></i> Create Key</button>
        </div>
        <div id="resellerTabContent" class="reveal">
          <div class="tab-pane active" id="reseller-keys">
            <div class="card card-glow">
              <div class="flex-between wrap">
                <span class="card-title" style="margin:0;"><span class="icon">🔑</span> Keys I Created</span>
                <button class="btn btn-sm btn-outline" onclick="window._resellerRefreshKeys()"><i class="fas fa-sync"></i> Refresh</button>
              </div>
              <div class="table-wrap"><table><thead><tr><th>Key</th><th>Duration</th><th>Used</th><th>Active</th><th>Created</th><th>Actions</th></tr></thead><tbody id="resellerKeysBody"><tr><td colspan="6" style="text-align:center;color:var(--text-muted);">Loading...</td></tr></tbody></table></div>
            </div>
          </div>
          <div class="tab-pane" id="reseller-clients">
            <div class="card card-glow">
              <div class="flex-between wrap">
                <span class="card-title" style="margin:0;"><span class="icon">👤</span> Clients Under My Provider</span>
                <button class="btn btn-sm btn-outline" onclick="window._resellerRefreshClients()"><i class="fas fa-sync"></i> Refresh</button>
              </div>
              <div class="table-wrap"><table><thead><tr><th>Username</th><th>Email</th><th>Status</th><th>SID</th><th>Active</th><th>Actions</th></tr></thead><tbody id="resellerClientsBody"><tr><td colspan="6" style="text-align:center;color:var(--text-muted);">Loading...</td></tr></tbody></table></div>
            </div>
          </div>
          <div class="tab-pane" id="reseller-create">
            <div class="card card-glow" style="max-width:460px;">
              <span class="card-title"><span class="icon">🔑</span> Create Reseller Key</span>
              <form id="resellerCreateKeyForm" onsubmit="return false;">
                <div class="form-group"><label>Duration</label><select class="form-control" id="resellerKeyDuration"><option value="1">1 Day</option><option value="3">3 Days</option><option value="7">7 Days</option><option value="30">1 Month</option><option value="lifetime">Lifetime</option></select></div>
                <button class="btn btn-primary btn-block" id="resellerCreateKeyBtn" type="submit"><i class="fas fa-plus-circle"></i> Generate Key</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    `;
    const tabBtns = $$('#resellerTabs .tab-btn');
    const moveResellerIndicator = initTabIndicator('resellerTabs');
    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        tabBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        moveResellerIndicator(btn);
        const target = btn.dataset.tab;
        $$('#resellerTabContent .tab-pane').forEach(p => p.classList.remove('active'));
        document.getElementById(target)?.classList.add('active');
        if (target === 'reseller-keys') loadResellerKeys();
        if (target === 'reseller-clients') loadResellerClients();
      });
    });
    loadResellerKeys();
    document.getElementById('resellerCreateKeyForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const duration = $('#resellerKeyDuration').value;
      const btn = $('#resellerCreateKeyBtn');
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
      try {
        const res = await apiCall('/api/reseller/create-key', 'POST', { duration }, getToken());
        if (res.success) { showToast('✅ Key created: ' + res.key, 'success'); loadResellerKeys(); }
        else showToast(res.message || 'Failed.', 'error');
      } catch (err) { showToast('Error: ' + err.message, 'error'); }
      finally { btn.disabled = false; btn.innerHTML = '<i class="fas fa-plus-circle"></i> Generate Key'; }
    });
  }

  async function loadResellerKeys() {
    const tbody = document.getElementById('resellerKeysBody');
    if (!tbody) return;
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);">Loading...</td></tr>';
    try {
      const res = await apiCall('/api/reseller/keys', 'GET', null, getToken());
      if (res.success && res.keys) {
        if (res.keys.length === 0) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);">No keys created yet.</td></tr>'; return; }
        tbody.innerHTML = res.keys.map(k => `
          <tr>
            <td class="key-cell">${escapeHtml(k.key)}</td>
            <td>${escapeHtml(String(k.duration))}</td>
            <td>${k.isUsed ? '✅ Used by ' + escapeHtml(k.usedBy || '—') : '🟢 Available'}</td>
            <td>${k.active !== undefined ? (k.active ? '🟢 Active' : '🔴 Banned') : '🟢 Active'}</td>
            <td style="font-size:11px;color:var(--text-muted);">${new Date(k.createdAt).toLocaleDateString()}</td>
            <td>
              <button class="btn btn-sm ${k.active ? 'btn-danger' : 'btn-success'}" onclick="window._resellerToggleKey('${escapeAttr(k.key)}')">${k.active ? 'Ban' : 'Unban'}</button>
              <button class="btn btn-sm btn-outline" onclick="window._resellerResetKey('${escapeAttr(k.key)}')" ${k.isUsed ? '' : 'disabled'}>Reset</button>
              <button class="btn btn-sm btn-danger" onclick="window._resellerDeleteKey('${escapeAttr(k.key)}')">Delete</button>
            </td>
          </tr>
        `).join('');
      } else tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);">Failed.</td></tr>';
    } catch { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);">Error.</td></tr>'; }
  }

  window._resellerToggleKey = async function(key) {
    try {
      const res = await apiCall('/api/reseller/toggle-key-active', 'POST', { key }, getToken());
      if (res.success) { showToast(res.message, 'success', 5000); loadResellerKeys(); }
      else showToast(res.message || 'Failed.', 'error');
    } catch (err) { showToast('Error: ' + err.message, 'error'); }
  };

  window._resellerResetKey = async function(key) {
    if (!confirm(`Reset key "${key}"? The client who used it will need to redeem again.`)) return;
    try {
      const res = await apiCall('/api/reseller/reset-key', 'POST', { key }, getToken());
      if (res.success) { showToast(res.message, 'success'); loadResellerKeys(); }
      else showToast(res.message || 'Failed.', 'error');
    } catch (err) { showToast('Error: ' + err.message, 'error'); }
  };

  window._resellerDeleteKey = async function(key) {
    if (!confirm(`Delete key "${key}"?\n\n⚠️ Bound client will lose access.`)) return;
    try {
      const res = await apiCall('/api/reseller/delete-key', 'DELETE', { key }, getToken());
      if (res.success) { showToast('Key deleted.', 'success'); loadResellerKeys(); }
      else showToast(res.message || 'Failed.', 'error');
    } catch (err) { showToast('Error: ' + err.message, 'error'); }
  };

  window._resellerRefreshKeys = loadResellerKeys;

  async function loadResellerClients() {
    const tbody = document.getElementById('resellerClientsBody');
    if (!tbody) return;
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);">Loading...</td></tr>';
    try {
      const res = await apiCall('/api/reseller/clients', 'GET', null, getToken());
      if (res.success && res.clients) {
        if (res.clients.length === 0) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);">No clients yet.</td></tr>'; return; }
        tbody.innerHTML = res.clients.map(c => `
          <tr>
            <td>${escapeHtml(c.username)}</td>
            <td>${escapeHtml(c.email || '—')}</td>
            <td>${c.premiumStatus === 'active' ? '🟢 Active' : (c.premiumStatus === 'expired' ? '🟠 Expired' : '🔴 Inactive')}</td>
            <td style="font-size:11px;font-family:var(--mono);">${escapeHtml(c.sid || '—')}</td>
            <td>${c.active !== undefined ? (c.active ? '🟢 Active' : '🔴 Banned') : '🟢 Active'}</td>
            <td>
              <button class="btn btn-sm ${c.active ? 'btn-danger' : 'btn-success'}" onclick="window._resellerToggleClient('${escapeAttr(c.username)}')">${c.active ? 'Ban' : 'Unban'}</button>
              <button class="btn btn-sm btn-outline" onclick="window._resellerResetClientSid('${escapeAttr(c.username)}')">Reset SID</button>
              <button class="btn btn-sm btn-danger" onclick="window._resellerDeleteClient('${escapeAttr(c.username)}')">Delete</button>
            </td>
          </tr>
        `).join('');
      } else tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);">Failed.</td></tr>';
    } catch { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);">Error.</td></tr>'; }
  }

  window._resellerToggleClient = async function(username) {
    try {
      const res = await apiCall('/api/reseller/toggle-client-active', 'POST', { username }, getToken());
      if (res.success) { showToast(res.message, 'success'); loadResellerClients(); }
      else showToast(res.message || 'Failed.', 'error');
    } catch (err) { showToast('Error: ' + err.message, 'error'); }
  };

  window._resellerResetClientSid = async function(username) {
    if (!confirm(`Reset SID for "${username}"?`)) return;
    try {
      const res = await apiCall('/api/reseller/reset-client-sid', 'POST', { username }, getToken());
      if (res.success) { showToast(res.message, 'success'); loadResellerClients(); }
      else showToast(res.message || 'Failed.', 'error');
    } catch (err) { showToast('Error: ' + err.message, 'error'); }
  };

  window._resellerDeleteClient = async function(username) {
    if (!confirm(`Delete client "${username}"?`)) return;
    try {
      const res = await apiCall('/api/reseller/delete-client', 'DELETE', { username }, getToken());
      if (res.success) { showToast('Client deleted.', 'success'); loadResellerClients(); }
      else showToast(res.message || 'Failed.', 'error');
    } catch (err) { showToast('Error: ' + err.message, 'error'); }
  };

  window._resellerRefreshClients = loadResellerClients;

  // ============ Logout / Nav ============
  window._logout = async function() {
    const token = getToken();
    if (token) { try { await apiCall('/api/auth/logout', 'POST', null, token); } catch {} }
    setToken(null); setUser(null); STATE.user = null;
    showToast('Logged out.', 'info'); navigate('login');
  };

  window._navigate = function(page) {
    if (page === 'login' || page === 'register') {
      if (isLoggedIn()) { showToast('You are already logged in.', 'info'); return; }
      navigate(page); return;
    }
    if (!isLoggedIn()) { showToast('Please login first.', 'error'); navigate('login'); return; }
    const role = getRole();
    if (page === 'admin' && role !== 'admin') { showToast('Admin access only.', 'error'); return; }
    if (page === 'reseller' && role !== 'reseller' && role !== 'admin') { showToast('Reseller access only.', 'error'); return; }
    navigate(page);
  };

  document.getElementById('brandLink').addEventListener('click', (e) => {
    e.preventDefault();
    if (!isLoggedIn()) { navigate('login'); return; }
    const role = getRole();
    navigate(role === 'admin' ? 'admin' : role === 'reseller' ? 'reseller' : 'dashboard');
  });

  // ============ Init ============
  function init() {
    const token = getToken();
    const user = getUser();
    if (token && user) {
      STATE.token = token; STATE.user = user;
      const role = user.role || 'client';
      if (role === 'admin') navigate('admin');
      else if (role === 'reseller') navigate('reseller');
      else navigate('dashboard');
    } else {
      navigate('login');
    }
  }

  init();
})();
</script>
</body>
</html>
